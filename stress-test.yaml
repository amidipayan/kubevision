apiVersion: v1
kind: Pod
metadata:
  name: stress-demo
  namespace: default
  labels:
    app: stress-test
spec:
  containers:
  - name: stress-cpu
    image: polinux/stress
    # Command to stress CPU: 1 core
    command: ["stress"]
    args: ["--cpu", "1"] 
    resources:
      limits:
        # Limit is SMALLER than usage (creates Red Bar/Throttling)
        cpu: "500m"      
        memory: "200Mi"
      requests:
        cpu: "100m"
        memory: "100Mi"
  - name: idle-container
    image: busybox
    command: ["sh", "-c", "sleep 3600"]
    resources:
      limits:
        # High limit, low usage (Creates Green Bar)
        cpu: "1000m"
        memory: "500Mi"
