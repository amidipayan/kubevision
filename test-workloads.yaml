apiVersion: v1
kind: Namespace
metadata:
  name: kubevision-test
---
# 1. A Healthy Web Deployment & Service (Good for SRE Heuristics & Port Forwarding)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-webapp
  namespace: kubevision-test
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: kubevision-test
spec:
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
# 2. A Crashing Pod (Good for testing Events, Logs, and filtering 'failed' states)
apiVersion: v1
kind: Pod
metadata:
  name: crashing-worker
  namespace: kubevision-test
  labels:
    app: worker
spec:
  containers:
  - name: faulty-container
    image: busybox
    command: ['sh', '-c', 'echo "Starting work..." && sleep 2 && echo "Fatal error: connection lost" && exit 1']
---
